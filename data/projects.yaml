      pt: Wiiascend Internet Banking
      en: Wiiascend Internet Banking
    description:
      pt: >
        Conta digital com Pix, boletos, pagamentos e gestão de conta, integrada a
        core bancário e plataformas BaaS. Construí o produto do zero à produção —
        frontend web em React/TypeScript/Redux/Tailwind e app iOS em Flutter (BLoC),
        com paridade de features; backend em Node.js, webhooks de pagamento,
        idempotência, reprocessamento e reconciliação; infraestrutura AWS com Terraform.
        Também atuei como Tech Lead do time.
      en: >
        Digital account with Pix, boletos, payments and account management, integrated
        with a banking core and BaaS platforms. Built from zero to production — web
        frontend in React/TypeScript/Redux/Tailwind and iOS app in Flutter (BLoC) with
        feature parity; Node.js backend, payment webhooks, idempotency, reprocessing
        and reconciliation; AWS infrastructure with Terraform. Also acted as Tech Lead.
