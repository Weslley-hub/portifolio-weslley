personal:
  - id: finlar
    featured: true
    icon: "fa-solid fa-wallet"
    image: ""
    status: done
    name:
      pt: Finlar
      en: Finlar
    description:
      pt: >
        Assistente financeiro da família no Telegram. Você escreve como fala —
        "gastei 45 no almoço", "recebi 5500 de salário" — e o bot organiza receitas,
        despesas, cartões, contas e o resumo do mês. Funciona só no grupo da família
        (não no chat privado): linguagem natural, recorrências e parcelas, limites de
        cartão, orçamento por categoria, OCR de comprovantes (foto/PDF) e perguntas
        como "quanto gastamos com mercado?" ou "como devemos terminar o mês?".
        Open source — @finance_house_bot.
      en: >
        Family finance assistant on Telegram. You write as you speak —
        "spent 45 on lunch", "got 5500 salary" — and the bot organizes income,
        expenses, cards, bills and the monthly summary. Works only in the family
        group (not in private chat): natural language, recurring bills and installments,
        card limits, category budgets, receipt OCR (photo/PDF) and questions like
        "how much did we spend on groceries?" or "how should the month end?".
        Open source — @finance_house_bot.
    tags: [TypeScript, Telegram Bot, NLP, Finanças, Open Source]
    links:
      repo: "https://github.com/Weslley-hub/finance_bot"
      demo: "https://t.me/finance_house_bot"
      store: ""

